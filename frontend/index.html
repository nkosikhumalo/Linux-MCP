<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Linux Helper</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="shell">
    <header class="top">
      <div class="brand">
        <button type="button" id="history-toggle" class="menu-btn" aria-label="Open chat history" aria-expanded="false" aria-controls="history-panel">
          <span aria-hidden="true">☰</span>
        </button>
        <svg class="brand-mark" viewBox="0 0 48 36" role="img" aria-label="Go gopher">
          <ellipse cx="24" cy="20" rx="16" ry="13" fill="#45b6df" />
          <ellipse cx="10" cy="12" rx="5" ry="8" fill="#45b6df" transform="rotate(-20 10 12)" />
          <ellipse cx="38" cy="12" rx="5" ry="8" fill="#45b6df" transform="rotate(20 38 12)" />
          <ellipse cx="18" cy="18" rx="2" ry="3" fill="#16232b" />
          <ellipse cx="30" cy="18" rx="2" ry="3" fill="#16232b" />
          <ellipse cx="24" cy="25" rx="7" ry="4" fill="#dff5fb" />
          <path d="M22 26q2 2 4 0" fill="none" stroke="#16232b" stroke-width="1.5" stroke-linecap="round" />
        </svg>
        <h1>Linux Helper</h1>
      </div>
      <button type="button" id="theme-btn" class="icon-btn" aria-label="Switch theme" title="Switch theme">
        <span id="theme-label">Light</span>
      </button>
    </header>

    <div class="workspace">
      <aside id="history-panel" class="history-panel" aria-label="Conversation history" aria-hidden="true">
        <div class="history-panel-heading">
          <div class="history-heading">Chat history</div>
          <button type="button" id="history-close" class="icon-btn history-close" aria-label="Close chat history">×</button>
        </div>
        <button type="button" id="new-chat" class="icon-btn new-chat-btn">＋ New chat</button>
        <div id="history-list" class="history-list"></div>
      </aside>
      <div id="history-backdrop" class="history-backdrop" aria-hidden="true"></div>
      <section class="chat-pane" aria-label="Chat">
        <main id="thread" class="thread" aria-live="polite">
          <section id="empty-state" class="empty-state" aria-label="Start a conversation">
            <div class="welcome-mark" aria-hidden="true"></div>
            <h2>What can I help with?</h2>
            <p>Ask about your system, investigate an issue, or get help with code.</p>
            <div class="prompt-suggestions">
              <button type="button" data-prompt="Give me a quick overview of my system">System overview</button>
              <button type="button" data-prompt="Check what is using the most CPU and memory">Find what is slowing my PC</button>
              <button type="button" data-prompt="Help me understand this error">Explain an error</button>
            </div>
          </section>
        </main>
        <footer class="composer">
          <div id="work-status" class="work-status" role="status" aria-live="polite" hidden>
            <span class="work-spinner" aria-hidden="true"></span>
            <span>Still working…</span>
          </div>
          <label class="sr-only" for="input">Message</label>
          <textarea
            id="input"
            rows="1"
            placeholder="Ask about your machine, code, or logs…"
            autocomplete="off"
          ></textarea>
          <button type="button" id="send" class="send-btn" disabled>Send</button>
          <button type="button" id="stop" class="stop-btn" hidden>Stop</button>
        </footer>
      </section>
    </div>
  </div>
  <script src="/js/app.js"></script>
</body>
</html>
