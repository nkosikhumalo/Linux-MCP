<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ubuntu Dev Assistant</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="shell">
    <header class="top">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <h1>Ubuntu Dev Assistant</h1>
      </div>
      <button type="button" id="theme-btn" class="icon-btn" aria-label="Switch theme" title="Switch theme">
        <span id="theme-label">Light</span>
      </button>
    </header>

    <main id="thread" class="thread" aria-live="polite"></main>

    <footer class="composer">
      <label class="sr-only" for="input">Message</label>
      <textarea
        id="input"
        rows="1"
        placeholder="Ask about your machine, code, or logs…"
        autocomplete="off"
      ></textarea>
      <button type="button" id="send" class="send-btn" disabled>Send</button>
    </footer>
  </div>
  <script src="/js/app.js"></script>
</body>
</html>
